name: pedidosapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  get: ^4.1.4
  get_storage: ^2.1.1
  dots_indicator: ^4.0.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.1
  firebase_messaging: ^16.4.0
  firebase_core: ^4.11.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  flutter_dotenv: ^6.0.1
  geocoding: ^4.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/image/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/logo.png"
  # ── Android Adaptive Icon (API 26+) ──────────────────────────────────
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/image/logo.png"
  # ── Android legacy (API < 26) ─────────────────────────────────────────
  android_min_sdk_version: 21
  # ── iOS ───────────────────────────────────────────────────────────────
  # flutter_launcher_icons rellena el fondo blanco automáticamente
  # para evitar bordes negros por transparencia en iOS
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"