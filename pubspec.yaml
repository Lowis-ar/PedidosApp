name: pedidosapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  get: ^4.1.4
  get_storage: ^2.1.1
  dots_indicator: ^4.0.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.1
  firebase_messaging: ^14.7.1
  firebase_core: ^2.21.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  flutter_dotenv: ^6.0.1
  geocoding: ^4.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900